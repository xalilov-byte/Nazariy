# ─────────────────────────────────────────────────────────────────────────
#  Nazariy — Android build (APK + AAB)
#
#  Kompyuteringizga hech narsa o'rnatmasdan yig'ish uchun: loyihani GitHub'ga
#  qo'ying, quyidagi Secrets'ni sozlang va Actions → "Android build" → Run.
#
#  GitHub → Settings → Secrets and variables → Actions → New repository secret:
#    KEYSTORE_BASE64     — kalit faylining base64 ko'rinishi
#                          (base64 -w0 nazariy.keystore > keystore.txt)
#    KEYSTORE_PASSWORD   — kalit ombori paroli
#    KEY_ALIAS           — kalit nomi (masalan: nazariy)
#    KEY_PASSWORD        — kalit paroli
#
#  Secrets qo'yilmasa ham workflow ishlaydi. Har doim uchta fayl chiqadi:
#    Nazariy-debug.apk    — telefonga DARHOL o'rnatiladi (sinash uchun)
#    Nazariy-release.apk  — secrets bo'lsa imzolangan, bo'lmasa imzosiz
#    Nazariy-release.aab  — Play Market uchun (imzo shart)
# ─────────────────────────────────────────────────────────────────────────
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Paketlarni o'rnatish
        run: npm ci

      - name: Web ilovani yig'ish (src/Main.dc.html → www/)
        run: node build.mjs

      - name: Capacitor sync
        run: npx cap sync android

      - name: Imzo kalitini tayyorlash (secret bo'lsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nazariy.keystore"
            echo "Kalit tayyor — imzolangan build."
          else
            echo "KEYSTORE_BASE64 yo'q — imzosiz build (faqat sinash uchun)."
          fi

      - name: APK va AAB yig'ish
        working-directory: android
        env:
          NAZARIY_KEYSTORE: ${{ runner.temp }}/nazariy.keystore
          NAZARIY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NAZARIY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NAZARIY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Natijalarni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: nazariy-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
